e en veganistische opties.\",\"orderNow\":\"Bestel direct\",\"freeTestLunch\":\"Bestel een gratis test lunch\"},\"cateringPage\":{\"heroLabel\":\"Catering\",\"heroTitle\":\"Catering zoals het hoort te zijn, vers, flexibel, en altijd op tijd\",\"heroSubtitle\":\"The Sandwich Bar catering levert rijk belegde broodjes aan jouw team – zonder poespas én budgetvriendelijk. Ontdek het zelf met een gratis proeflunch box: 5 vers gemaakte broodjes, direct op kantoor bezorgd. Zin om te proeven?\",\"heroContactLabel\":\"Vragen? Neem contact op:\",\"heroContactEmail\":\"orders@thesandwichbar.nl\",\"heroContactPhone1\":\"06-15657447\",\"heroContactPhone2\":\"06-15004988\",\"logosTitle\":\"Zij gingen je al voor\",\"menuTitle\":\"Catering menu\",\"menuSubtitle\":\"Bekijk ons complete catering aanbod.\",\"formTitle\":\"Bestel je gratis proeflunch box\",\"formSubtitle\":\"Vul het formulier in en wij bezorgen 5 vers gemaakte broodjes op jouw kantoor.\",\"formNote\":\"Het is niet mogelijk om een test box voor vandaag te bestellen — minimaal één dag van te voren bestellen.\",\"companyName\":\"Bedrijfsnaam\",\"yourName\":\"Jouw naam\",\"email\":\"Email\",\"phone\":\"Telefoon\",\"deliveryDate\":\"Bezorgdatum\",\"deliveryTime\":\"Bezorgtijd\",\"address\":\"Adres\",\"postalCode\":\"Postcode\",\"submit\":\"Aanvraag versturen\",\"submitting\":\"Versturen...\",\"successTitle\":\"Aanvraag ontvangen!\",\"successMessage\":\"We nemen snel contact met je op om je gratis proeflunch box te bevestigen.\",\"errorMessage\":\"Er is iets misgegaan. Probeer het opnieuw of stuur een mail naar orders@thesandwichbar.nl\"},\"member\":{\"label\":\"Loyaliteitsprogramma\",\"titleWord\":\"Word\",\"titleAccent\":\"member\",\"p1\":\"Voor elke euro die je bij ons uitgeeft in een van onze vestigingen, ontvang je 1 loyalty punt.\",\"p2\":\"Deze gespaarde punten kun je weer inwisselen voor leuke beloningen. Denk aan een broodje naar keuze, koffiebonen van BOCCA of een te gekke sandwich bar hoodie.\",\"p3\":\"Zie jij jez
